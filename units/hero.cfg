#textdomain wesnoth-units

[unit_type]
    id=Hero
    name= _ "The Rookie"
    race=human
    image="units/tank-base.png"
    profile="portraits/bordal.png"
    hitpoints=10
    movement_type=woodland
    movement=5
    experience=10
    level=1
    alignment=neutral
    advances_to=null
    cost=12
    usage="mixed fighter"
	jamming=1
    description= _ ""
    die_sound={SOUND_LIST:HUMAN_DIE}

    [attack]
        name=knife
        description= _ "Knife"
        type=pierce
        icon=attacks/dagger-curved.png
        range=melee
        damage=4
        number=2
    [/attack]
    
    {LEVEL_1_ADVANCEMENT}

    #Unit initialization
    [event]
        name=unit placed
        first_time_only=no
    
        [filter]
            type=Hero
        [/filter]

        [modify_unit]
            [filter]
                id=$unit.id
            [/filter]
            [effect]
                apply_to=variable
                name=levels
                set=0
            [/effect]
            [effect]
                apply_to=variable
                name=resistance
                set=0
            [/effect]
            [effect]
                apply_to=variable
                name=class
                set=base
            [/effect]
        [/modify_unit]
    [/event]

    #Tank defense ability
    [event]
        id=tank_defense_event
        name=turn refresh
        first_time_only=no
        [modify_unit]
            [filter]
                side=$side_number
                [filter_adjacent]
                    ability=tank_defense
                    is_enemy=yes
                [/filter_adjacent]
            [/filter]
            moves=1
        [/modify_unit]
    [/event]
[/unit_type]
