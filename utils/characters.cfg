#define CHARACTER_LEADERSHIP_Cot3K
[abilities]
	[leadership]
        id=hadvezetes
        value="((level * 10 + 30) - (other.level * 10))"
        cumulative=yes
        name= _ "Hadvezetés"
        female_name= _ "female^hadvezetés"
        description= _ "This unit can lead your own units that are next to it, making them fight better."
		affect_self=no
		affect_allies=yes
        [affect_adjacent]
            [filter]
                formula="5 > level"
            [/filter]
        [/affect_adjacent]
    [/leadership]
[/abilities]
#enddef

