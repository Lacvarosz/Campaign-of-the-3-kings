#define ZABUZA
    [event]
        name=start
        [recall]
            id=Zabuza
        [/recall]
        [modify_unit]
            [filter]
                id=Zabuza
            [/filter]
            canrecruit=yes
            extra_recruit="Thief,Poacher,Footpad,Thug"
        [/modify_unit]
    [/event]
    [event]
        name=recall
        [filter]
            id=Zabuza
        [/filter]
        [message]
            speaker=Zabuza
            message= _ "Itt vagyok, uram, és az embereim is várják a harcot."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Zabuza
        [/filter]
        [message]
            speaker=Zabuza
            message= _ "Rohadt életbe.... Pedig mennyi... zsákmány várt ... rám...."
        [/message]
    [/event]
#enddef

