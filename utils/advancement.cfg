#define HP_INCREASE_EFFECT HP
    [effect]
        apply_to=hitpoints
        increase_total={HP}
        increase={HP}
    [/effect]
#enddef

#define LEVEL_INCREMENT
    [effect]
        apply_to=variable
        name=levels
        add=1
    [/effect]
#enddef

#define AMLA_BASE_EFFECTS HP
    {HP_INCREASE_EFFECT {HP}}
    {LEVEL_INCREMENT}
#enddef

#define LEVEL_UP_EFFECTS
    [effect]
        apply_to=hitpoints
        heal_full=yes
    [/effect]
    [effect]
        apply_to=status
        remove=poisoned,slowed,dazed,stunned,confused
    [/effect]
    [effect]
        apply_to=level
        increase=1
    [/effect]
    [effect]
        apply_to=max_experience
        increase=250%
    [/effect]
#enddef

#define FILTER_LEVEL_ADVANCEMENT_1
    [filter_wml]
        [not]
            [variables]
                levels=10
            [/variables]
        [/not]
    [/filter_wml]
#enddef


#define FILTER_LEVEL_ADVANCEMENT_2
