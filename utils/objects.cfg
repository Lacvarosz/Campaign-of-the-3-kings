#define STAFF_SPECIALS_OBJECT
    [object]
        id = staff_specials
        [effect]
            apply_to = new_advancement
            [advancement]
                id = staff_marksman
                description = _ "Add marksman special to weapon staff"
                image = attacks/sword-elven.png # TODO
                max_times = 1
                require_amla = staff_attack, staff_attack
                {HEAL_EFFECTS_ULTIMATE}
                {XP_INCREASE_EFFECT_ULTIMATE}
                [effect]
                    apply_to = attack
                    name = staff
                    [set_specials]
                        {WEAPON_SPECIAL_MARKSMAN}
                    [/set_specials]
                [/effect]
            [/advancement]

            [advancement]
                id = staff_stun
                description = _ "Add firststrike special to weapon staff"
                image = attacks/sword-elven.png # TODO
                max_times = 1
                require_amla = staff_attack, staff_attack, staff_attack, staff_attack
                [filter]
                    [has_atatck]
                        name = staff
                        formula = "weapon.damage >= 10"
                    [/has_atatck]
                [/filter]
                {HEAL_EFFECTS_ULTIMATE}
                {XP_INCREASE_EFFECT_ULTIMATE}
                [effect]
                    apply_to = attack
                    name = staff
                    [set_specials]
                        {WEAPON_SPECIAL_STUN}
                    [/set_specials]
                [/effect]
            [/advancement]

            [advancement]
                id = staff_firststrike
                description = _ "Add firststrike special to weapon staff"
                image = attacks/sword-elven.png # TODO
                max_times = 1
                require_amla = staff_attack, staff_attack, staff_attack, staff_attack
                {HEAL_EFFECTS_ULTIMATE}
                {XP_INCREASE_EFFECT_ULTIMATE}
                [effect]
                    apply_to = attack
                    name = staff
                    [set_specials]
                        {WEAPON_SPECIAL_FIRSTSTRIKE}
                    [/set_specials]
                [/effect]
            [/advancement]
        [/effect]
    [/object]
#enddef
