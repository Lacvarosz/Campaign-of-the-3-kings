        [not]
            [variables]
                levels=20
            [/variables]
        [/not]
    [/filter_wml]
#enddef


#define FILTER_LEVEL_ADVANCEMENT_3
    [filter_wml]
        [not]
            [variables]
                levels=30
            [/variables]
        [/not]
    [/filter_wml]
#enddef

#define PERCENT_STATS_ADVANCEMENT FILTER VARIABLE VALUE STAT TYPE LIMIT CHANGE
    [filter]
        {FILTER}
        [filter_wml]
            [variables]
                {VARIABLE}={VALUE}
            [/variables]
            [not]
                [{STAT}]
                    {TYPE}={LIMIT}
                [/{STAT}]
            [/not]
        [/filter_wml]
    [/filter]
    [effect]
        apply_to={STAT}
        [{STAT}]
            {TYPE}={CHANGE}
        [/{STAT}]
    [/effect]
    [effect]
        apply_to=variable
        name={VARIABLE}
        add=1
    [/effect]
#enddef

