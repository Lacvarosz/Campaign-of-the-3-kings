#textdomain wesnoth-units

#undef ULTIMATE_ADVANCEMENT
#define HEAL_EFFECTS_ULTIMATE
    major_amla=yes
    [effect]
        apply_to=hitpoints
        increase_total=15%
    [/effect]
    [effect]
        apply_to=hitpoints
        heal_full=yes
    [/effect]
    [effect]
        apply_to=status
        remove=poisoned
    [/effect]
    [effect]
        apply_to=status
        remove=slowed
    [/effect]
    [effect]
        apply_to=status
        remove=dazed
    [/effect]
#enddef

#define XP_INCREASE_EFFECT_ULTIMATE
    [effect]
        apply_to=max_experience
        increase=20%
    [/effect]
#enddef

#define ULTIMATE_ADVANCEMENT
    [advancement]
        id = staff_damage
        description = _ "Increase the damage of the staff"
        imgage = attacks/sword-elven.png # TODO
        max_times = -1
        {HEAL_EFFECTS_ULTIMATE}
        {XP_INCREASE_EFFECT_ULTIMATE}
        [effect]
            apply_to = attack
            name = staff
            increase_damage = 1
        [/effect]
    [/advancement]

    [advancement]
        id = staff_attack
        description = _ "Increase the attack count of the stuff, but reduce its damage"
        image = attacks/sword-elven.png # TODO
        max_times = 4
        {HEAL_EFFECTS_ULTIMATE}
        {XP_INCREASE_EFFECT_ULTIMATE}
        [effect]
            apply_to = increment_attack
            name = staff
        [/effect]
    [/advancement]
#enddef

[unit_type]
    id=Ultimate Fighter
    name= _ "The Fighter"
    race=human
    image="units/elves/noble.png"
    profile="portraits/elves-woods/lord.png"
    hitpoints=28
    movement_type=woodland
    movement=5
    experience=20
    level=0
    alignment=neutral
    advances_to=null
    cost=12
    usage="mixed fighter"
	jamming=1
    description= _ ""
    die_sound={SOUND_LIST:HUMAN_DIE}

    {DEFENSE_ANIM_RANGE "units/elves-wood/lord-defend.png" "units/elves-wood/lord.png" {SOUND_LIST:ELF_HIT} melee}
    {DEFENSE_ANIM_RANGE "units/elves-wood/lord-magic-defend.png" "units/elves-wood/lord-magic.png" {SOUND_LIST:ELF_HIT} ranged}
    
    [attack]
        name=staff
        description=_"staff"
        type=impact
        range=melee
        damage=6
        number=2
        icon=attacks/sword-elven.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=magic
        [/filter_attack]
        {MISSILE_FRAME_FAERIE_FIRE}

        start_time=-450
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg -450}
        [frame]
            image="units/elves-wood/lord-magic.png:150,units/elves-wood/lord-magic-1.png"
            halo=halo/elven/faerie-fire-halo[1~7].png:75
            halo_x,halo_y=-19,-13
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=kard
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/elves-wood/lord.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
        [frame]
            image="units/elves-wood/lord-melee.png:225"
        [/frame]
        [frame]
            image="units/elves-wood/lord.png:75"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-445
        [frame]
            image="units/elves-wood/avenger-bow.png:65"
        [/frame]
        {SOUND:HIT_AND_MISS bow.ogg bow-miss.ogg -380}
        [frame]
            image="units/elves-wood/avenger-bow-attack[1~4].png:[75*2,100,130]"
        [/frame]
        [frame]
            image="units/elves-wood/avenger-bow.png:65"
        [/frame]
    [/attack_anim]

    {ULTIMATE_ADVANCEMENT}
[/unit_type]
