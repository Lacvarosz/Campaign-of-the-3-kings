# blade, pierce, impact, fire, cold, and arcane

#define HEAL_EFFECTS_ULTIMATE
    major_amla=yes
    [effect]
        apply_to=hitpoints
        increase_total=5%
    [/effect]
    [effect]
        apply_to=hitpoints
        increase=16
    [/effect]
    [effect]
        apply_to=status
        remove=poisoned
    [/effect]
    [effect]
        apply_to=status
        remove=slowed
    [/effect]
    [effect]
        apply_to=status
        remove=dazed
    [/effect]
#enddef

#define XP_INCREASE_EFFECT_ULTIMATE
    [effect]
        apply_to=max_experience
        increase=5%
    [/effect]
#enddef
#define ARCHERY_OBJECT 
    [object]
        id = archery
        [effect]
            apply_to = new_advancement
            [advancement]
                id = bow_using
                description= _ "Add new ranged bow attack"
                image = attacks/bow-elven.png # TODO
                max_times = 1
                {HEAL_EFFECTS_ULTIMATE}
                {XP_INCREASE_EFFECT_ULTIMATE}
                [effect]
                    apply_to = new_attack
                    name = bow
                    description = _ "Bow"
                    type = pierce
                    range = ranged
                    damage = 3
                    number = 1
                    icon = attacks/bow-elven.png #TODO
                [/effect]
            [/advancement]
            
            [advancement]
                id = bow_damage
                description = _ "Increase the damage of the bow"
                image = attacks/bow-elven.png # TODO
                max_times = -1
                require_amla = bow_using
                {HEAL_EFFECTS_ULTIMATE}
                {XP_INCREASE_EFFECT_ULTIMATE}
                [effect]
                    apply_to = attack
                    name = bow
                    increase_damage = 1
                [/effect]
            [/advancement]

            [advancement]
                id = bow_attack
                description = _ "Increase the attack count of the bow, but reduce its damage"
                image = attacks/bow-elven.png # TODO
                max_times = 5
                require_amla = bow_using
                {HEAL_EFFECTS_ULTIMATE}
                {XP_INCREASE_EFFECT_ULTIMATE}
                [effect]
                    apply_to = increment_attack
                    name = bow
                [/effect]
            [/advancement]
        [/effect]
    [/object]
#enddef

