#textdomain wesnoth-units

[unit_type]
    id=Ultimate Fighter
    name= _ "The Fighter"
    race=human
    image="units/elves/noble.png"
    profile="portraits/bordal.png"
    hitpoints=10
    movement_type=woodland
    movement=5
    experience=10
    level=1
    alignment=neutral
    advances_to=null
    cost=12
    usage="mixed fighter"
	jamming=1
    description= _ ""
    die_sound={SOUND_LIST:HUMAN_DIE}
    
    {LEVEL_1_ADVANCEMENT}

    [event]
        name = unit placed
        first_time_only=no
        [filter]
            type=Ultimate Fighter
            x,y=$x1,$y1
            [not]
                formula="'levels' in wml_vars"
            [/not]
        [/filter]
        [set_variable]
            name=levels
            value=0
        [/set_variable]
        [object]
            [filter]
                id=$unit.id
            [/filter]
            silent=yes
            [effect]
                apply_to=new_attack
                name=knife
                description= _ "Knife"
                type=pierce
                icon=attacks/dagger-curve.png
                range=melee
                damage=4
                number=2
            [/effect]
        [/object]
    [/event]

    [event]
        name=pre advance
        first_time_only=no
        [filter]
            type=Ultimate Fighter
        [/filter]
        [store_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            variable=unit
            kill=no
        [/store_unit]

        [set_variable]
            name=unit.variables.levels
            add=1
        [/set_variable]
        [unstore_unit]
            variable=unit
            find_vacant=no
            advance=no
        [/unstore_unit]
        {CLEAR_VARIABLE unit}
    [/event]
[/unit_type]
